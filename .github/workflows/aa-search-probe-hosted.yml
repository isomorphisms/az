name: AA hosted ICU search probe

on:
  push:
    branches:
      - AA
    paths:
      - .github/workflows/aa-search-probe-hosted.yml

permissions:
  contents: read

jobs:
  loring-tu:
    # One-shot experimental probe. This workflow is removed after the receipt.
    runs-on: ubuntu-latest
    steps:
      - name: Install ICU build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y chezscheme libssl-dev

      - name: Fetch pinned Idric, Idric-Net, and ICU
        run: |
          set -eu
          fetch_commit() {
            repository=$1
            revision=$2
            destination=$3
            git init "$destination"
            git -C "$destination" remote add origin "https://github.com/$repository.git"
            git -C "$destination" fetch --depth=1 origin "$revision"
            git -C "$destination" checkout --detach FETCH_HEAD
          }
          fetch_commit isomorphisms/Idric 47557b43053c829d4f8aa1581007002b57f9c59f "$RUNNER_TEMP/Idric"
          fetch_commit isomorphisms/Idric-Net 3b1d1305f7a4a501938118300d156dfab721f958 "$RUNNER_TEMP/Idric-Net"
          fetch_commit dilapidated-shed/icu 8150e62263a4a3df3f71f64646cfd8b4d458e61b "$RUNNER_TEMP/icu"

      - name: Build ICU through Idric
        run: |
          set -eu
          make -C "$RUNNER_TEMP/Idric" bootstrap SCHEME=scheme
          export IDRIS2_PREFIX="$RUNNER_TEMP/Idric/bootstrap-build"
          cd "$RUNNER_TEMP/Idric-Net"
          "$RUNNER_TEMP/Idric/build/exec/idris2" --install idric-net.ipkg
          cd "$RUNNER_TEMP/icu"
          make check-native
          make IDRIC="$RUNNER_TEMP/Idric/build/exec/idris2"

      - name: Search for Loring Tu through compiled ICU
        run: |
          set -eu
          output="$RUNNER_TEMP/aa-loring-tu.html"
          cd "$RUNNER_TEMP/icu"
          ./build/exec/icu get 'https://annas-archive.gl/search?q=Loring%20Tu' > "$output"
          test -s "$output"

          bytes=$(wc -c < "$output")
          loring_count=$(tr '<' '\n' < "$output" | awk '
            BEGIN { count = 0 }
            {
              line = tolower($0)
              while (match(line, /loring tu/)) {
                count++
                line = substr(line, RSTART + RLENGTH)
              }
            }
            END { print count }
          ')
          result_card_count=$(tr '<' '\n' < "$output" | awk '
            BEGIN { count = 0 }
            /js-aarecord-list-outer/ { count++ }
            END { print count }
          ')
          title_link_count=$(tr '<' '\n' < "$output" | awk '
            BEGIN { count = 0 }
            /js-vim-focus/ { count++ }
            END { print count }
          ')

          printf 'bytes=%s\n' "$bytes"
          printf 'loring_tu_occurrences=%s\n' "$loring_count"
          printf 'record_containers=%s\n' "$result_card_count"
          printf 'js_vim_focus_links=%s\n' "$title_link_count"

          tr '<' '\n' < "$output" | awk '
            BEGIN { shown = 0 }
            tolower($0) ~ /loring tu/ {
              text = $0
              gsub(/[[:space:]]+/, " ", text)
              if (length(text) > 500) text = substr(text, 1, 500) "..."
              print "match=" text
              shown++
              if (shown == 12) exit
            }
          '

          test "$loring_count" -gt 0
          test "$title_link_count" -gt 0
