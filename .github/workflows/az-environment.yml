name: AZ environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  associate-id:
    runs-on: ubuntu-latest
    environment: az
    env:
      AZ_PARTNER_TAG: ${{ secrets.ASSOCIATE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify associate ID wiring
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZ_PARTNER_TAG"
          url=$(bash bin/az link B012345678)
          test "$url" = "https://www.amazon.com/dp/B012345678?tag=$AZ_PARTNER_TAG"
          printf 'ok\n'
