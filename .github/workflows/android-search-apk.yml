name: android-search-test-apk

on:
  pull_request:
    paths:
      - 'android-search/**'
      - '.github/workflows/android-search-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Ensure Android SDK inputs
        shell: sh
        run: |
          set -eu
          sdk_root=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}
          test -n "$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -111 | sort | tail -n 1)
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Build direct non-Gradle test APK
        shell: sh
        run: |
          set -eu
          sh android-search/build-apk.sh

      - name: Inspect test APK boundary
        shell: sh
        run: |
          set -eu
          apk=android-search/build/az-search-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk" | grep -F 'android.permission.INTERNET'; then
            echo 'unexpected INTERNET permission in AZ search APK' >&2
            exit 1
          fi
          unzip -l "$apk"
          sha256sum "$apk" | tee android-search/build/az-search-debug.apk.sha256
          git rev-parse HEAD | tee android-search/build/SOURCE-COMMIT.txt

      - name: Write phone test instructions
        shell: sh
        run: |
          cat > android-search/build/PHONE-TEST.txt <<'EOF'
          1. Install az-search-debug.apk with Android's package installer.
          2. Keep Creator credentials only in ~/.config/az/amazon-secret in Termux.
          3. From this extracted bundle run:
             ysh android-search/show-results.ysh 'Loring Tu'
          4. Record separately whether the Activity launches and whether real results visibly render.

          The APK itself has no INTERNET permission and contains no Creator credentials.
          EOF

      - name: Retain exact-head phone test bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: az-search-phone-test-bundle
          path: |
            android-search/build/az-search-debug.apk
            android-search/build/az-search-debug.apk.sha256
            android-search/build/SOURCE-COMMIT.txt
            android-search/build/PHONE-TEST.txt
            android-search/show-results.ysh
            bin/az
            config/amazon-public
          if-no-files-found: error
