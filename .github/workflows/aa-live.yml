name: AA live resolver

on:
  workflow_dispatch:
    inputs:
      md5:
        description: Anna's Archive record MD5
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    environment: AA
    env:
      AA_MD5: ${{ inputs.md5 }}
    steps:
      - name: Checkout exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/az-aa"
          git init "$RUNNER_TEMP/az-aa"
          git -C "$RUNNER_TEMP/az-aa" remote add origin "https://github.com/$REPOSITORY.git"
          git -C "$RUNNER_TEMP/az-aa" fetch --depth=1 origin "$REVISION"
          git -C "$RUNNER_TEMP/az-aa" checkout --detach FETCH_HEAD

      - name: Install ICU build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y chezscheme libssl-dev jq

      - name: Fetch pinned Idric, Idric-Net, and ICU
        run: |
          set -eu
          fetch_commit() {
            repository=$1
            revision=$2
            destination=$3
            git init "$destination"
            git -C "$destination" remote add origin "https://github.com/$repository.git"
            git -C "$destination" fetch --depth=1 origin "$revision"
            git -C "$destination" checkout --detach FETCH_HEAD
          }
          fetch_commit isomorphisms/Idric 47557b43053c829d4f8aa1581007002b57f9c59f "$RUNNER_TEMP/Idric"
          fetch_commit isomorphisms/Idric-Net 3b1d1305f7a4a501938118300d156dfab721f958 "$RUNNER_TEMP/Idric-Net"
          fetch_commit dilapidated-shed/icu 8150e62263a4a3df3f71f64646cfd8b4d458e61b "$RUNNER_TEMP/icu"

      - name: Build ICU through Idric
        run: |
          set -eu
          make -C "$RUNNER_TEMP/Idric" bootstrap SCHEME=scheme
          export IDRIS2_PREFIX="$RUNNER_TEMP/Idric/bootstrap-build"
          cd "$RUNNER_TEMP/Idric-Net"
          "$RUNNER_TEMP/Idric/build/exec/idris2" --install idric-net.ipkg
          cd "$RUNNER_TEMP/icu"
          make check-native
          make IDRIC="$RUNNER_TEMP/Idric/build/exec/idris2"

      - name: Resolve through ICU
        env:
          AA: ${{ secrets.AA }}
          ICU: ${{ runner.temp }}/icu/build/exec/icu
        run: |
          set -eu
          cd "$RUNNER_TEMP/az-aa"
          command -v jq
          test -x "$ICU"
          bash -n bin/aa
          bash bin/aa resolve "$AA_MD5" > "$RUNNER_TEMP/aa-download-url"
          test -s "$RUNNER_TEMP/aa-download-url"
          grep -Eq '^https?://' "$RUNNER_TEMP/aa-download-url"
