name: AA ICU native search probe

on:
  push:
    branches:
      - AA
    paths:
      - .github/workflows/aa-native-search-probe-hosted.yml

permissions:
  contents: read

jobs:
  loring-tu:
    # One-shot experimental probe. This workflow is removed after the receipt.
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned ICU transport
        run: |
          set -eu
          git init "$RUNNER_TEMP/icu"
          git -C "$RUNNER_TEMP/icu" remote add origin https://github.com/dilapidated-shed/icu.git
          git -C "$RUNNER_TEMP/icu" fetch --depth=1 origin 8150e62263a4a3df3f71f64646cfd8b4d458e61b
          git -C "$RUNNER_TEMP/icu" checkout --detach FETCH_HEAD

      - name: Build native ICU probe
        run: |
          set -eu
          cat > "$RUNNER_TEMP/icu-aa-probe.c" <<'C'
          #include <stdio.h>

          int icu_send_https(const char *host, int port, const char *request_headers,
                             const char *request_body, int request_body_length);

          int main(void) {
              const char *request =
                  "GET /search?q=Loring%20Tu HTTP/1.0\r\n"
                  "Host: annas-archive.gl\r\n"
                  "Accept-Encoding: identity\r\n"
                  "Connection: close\r\n"
                  "\r\n";
              return icu_send_https("annas-archive.gl", 443, request, "", 0);
          }
          C
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            "$RUNNER_TEMP/icu/native/transport.c" "$RUNNER_TEMP/icu-aa-probe.c" \
            -lssl -lcrypto -o "$RUNNER_TEMP/icu-aa-probe"

      - name: Fetch and inspect Loring Tu search
        run: |
          set -eu
          output="$RUNNER_TEMP/aa-loring-tu.html"
          "$RUNNER_TEMP/icu-aa-probe" > "$output"
          test -s "$output"

          bytes=$(wc -c < "$output")
          loring_count=$(tr '<' '\n' < "$output" | awk '
            BEGIN { count = 0 }
            {
              line = tolower($0)
              while (match(line, /loring tu/)) {
                count++
                line = substr(line, RSTART + RLENGTH)
              }
            }
            END { print count }
          ')
          record_container_count=$(tr '<' '\n' < "$output" | awk '
            BEGIN { count = 0 }
            /js-aarecord-list-outer/ { count++ }
            END { print count }
          ')
          title_link_count=$(tr '<' '\n' < "$output" | awk '
            BEGIN { count = 0 }
            /js-vim-focus/ { count++ }
            END { print count }
          ')

          printf 'bytes=%s\n' "$bytes"
          printf 'loring_tu_occurrences=%s\n' "$loring_count"
          printf 'record_containers=%s\n' "$record_container_count"
          printf 'js_vim_focus_links=%s\n' "$title_link_count"

          tr '<' '\n' < "$output" | awk '
            BEGIN { shown = 0 }
            tolower($0) ~ /loring tu/ {
              text = $0
              gsub(/[[:space:]]+/, " ", text)
              if (length(text) > 500) text = substr(text, 1, 500) "..."
              print "match=" text
              shown++
              if (shown == 12) exit
            }
          '

          test "$loring_count" -gt 0
          test "$title_link_count" -gt 0
